<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr><td style="padding:28px 32px;">
      <p style="margin:0 0 16px;font-size:15px;">Hello {{ full_name }},</p>
      <h1 style="margin:0 0 12px;font-size:20px;">{{ title }}</h1>
      <p style="margin:0 0 24px;font-size:15px;line-height:1.5;">{{ message }}</p>
      {% if action_link %}
      <p style="margin:0 0 24px;"><a href="{{ action_link }}" style="display:inline-block;padding:10px 18px;background:#2563eb;color:#ffffff;text-decoration:none;border-radius:6px;font-size:14px;">Open DEAS</a></p>
      {% endif %}
      <p style="margin:0;font-size:12px;color:#6b7280;">You receive this e-mail because of your DEAS notification settings.{% if preferences_link %} <a href="{{ preferences_link }}" style="color:#6b7280;">Change them</a>.{% endif %}</p>
    </td></tr>
  </table>
</body>
</html>
